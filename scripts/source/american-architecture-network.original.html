<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>American Architecture — The Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0d2a44; --ground-2:#08192a; --paper:#e6eef4; --paper-dim:#a2bacd;
  --rule:rgba(159,193,216,.26); --rule-strong:rgba(159,193,216,.5);
  --office:#f0b46b; --studio:#5fcfe8; --partner:#f07ab0; --hire:#8fdc9b;
  --principal:#8fa6ba; --honor:#e0c065; --seat:#b092ff;
  --f-disp:"Archivo Narrow",Arial Narrow,sans-serif; --f-body:"Spectral",Georgia,serif; --f-mono:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ground-2);color:var(--paper);font-family:var(--f-body);font-size:15px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--office);outline-offset:2px}

#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.dragging{cursor:grabbing}

.panel{
  position:fixed;background:rgba(8,25,42,.9);backdrop-filter:blur(9px);
  border:1px solid var(--rule);z-index:10
}
#head{top:0;left:0;right:0;border-left:none;border-right:none;border-top:none;padding:10px 16px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
#head h1{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.03em;font-size:18px;font-weight:700;margin:0}
#head .sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
#head .counts{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--paper-dim)}

#left{top:56px;left:0;bottom:0;width:246px;padding:14px 12px 30px;overflow:auto;border-bottom:none;border-left:none}
.lab{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-dim);
  display:flex;align-items:center;gap:8px;margin:16px 0 7px}
.lab:first-child{margin-top:0}
.lab::after{content:"";flex:1;height:1px;background:var(--rule)}
input[type=search]{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--rule);color:var(--paper);
  font-family:var(--f-disp);font-size:14px;padding:7px 9px;border-radius:0}
input[type=search]::placeholder{color:var(--paper-dim)}
#hits{margin-top:6px;display:flex;flex-direction:column;gap:2px;max-height:190px;overflow:auto}
#hits button{text-align:left;font-family:var(--f-disp);font-size:13.5px;padding:2px 0;display:flex;gap:6px;align-items:baseline}
#hits .kind{font-family:var(--f-mono);font-size:9px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.1em}

.toggle{display:flex;align-items:center;gap:8px;width:100%;padding:4px 2px;text-align:left;font-family:var(--f-disp);font-size:13px}
.toggle:hover{color:#fff}
.swatch{width:22px;height:0;border-top-width:2px;border-top-style:solid;flex:0 0 auto}
.dot{width:9px;height:9px;flex:0 0 auto;border:1.4px solid currentColor}
.dot.person{border-radius:50%;background:currentColor}
.dot.practice{border-radius:0}
.dot.award{transform:rotate(45deg)}
.dot.school{border-radius:50%}
.toggle[aria-pressed=false]{opacity:.35}
.count{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--paper-dim)}

.preset{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.preset button{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:4px 6px;color:var(--paper-dim)}
.preset button:hover{border-color:var(--rule-strong);color:var(--paper)}
.preset button[aria-pressed=true]{background:var(--office);border-color:var(--office);color:#08192a}

#right{top:56px;right:0;bottom:0;width:330px;padding:16px 16px 40px;overflow:auto;border-right:none;border-bottom:none}
#right[hidden]{display:none}
.d-kind{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim)}
.d-name{font-family:var(--f-disp);text-transform:uppercase;font-weight:700;font-size:21px;line-height:1.06;margin:5px 0 3px}
.d-life{font-family:var(--f-mono);font-size:11px;color:var(--paper-dim);margin-bottom:10px}
.d-note{font-size:14px;margin:0 0 12px}
.d-post{font-size:13.5px;border-left:2px solid var(--seat);padding-left:9px;margin:0 0 12px;color:#dbe7f0}
.d-post .ver{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--hire);display:block;margin-top:3px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);padding:2px 5px;color:var(--paper-dim)}
.tag.aw{border-color:rgba(224,192,101,.5);color:var(--honor)}
.rel-group{margin-bottom:12px}
.rel-head{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.rel-list{display:flex;flex-direction:column;gap:1px}
.rel-list button{text-align:left;font-family:var(--f-disp);font-size:13.5px;padding:1px 0}
.rel-list button:hover{text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:5px;margin:14px 0 0;flex-wrap:wrap}
.actions button{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule-strong);padding:5px 8px}
.actions button:hover{background:var(--paper);color:var(--ground-2)}
.empty{color:var(--paper-dim);font-size:13.5px}

#hint{position:fixed;bottom:10px;left:258px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--paper-dim);z-index:9;pointer-events:none}
#tip{position:fixed;z-index:20;pointer-events:none;background:rgba(8,25,42,.95);border:1px solid var(--rule-strong);
  padding:5px 8px;font-family:var(--f-disp);font-size:13px;display:none;max-width:250px}
#tip .t2{font-family:var(--f-mono);font-size:9.5px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.1em}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:var(--ground-2);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--paper-dim)}
#sheet-toggle{display:none}
@media (max-width:860px){
  #left{width:200px}
  #right{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:56vh;border:none;border-top:1px solid var(--rule-strong)}
  #hint{display:none}
}
@media (max-width:620px){
  #left{position:fixed;left:0;top:56px;bottom:auto;width:100%;max-height:44vh;border-bottom:1px solid var(--rule)}
  #left[hidden]{display:none}
  #sheet-toggle{display:block;position:fixed;top:60px;right:8px;z-index:12;border:1px solid var(--rule-strong);
    padding:5px 8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:rgba(8,25,42,.9)}
}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<header class="panel" id="head">
  <h1>American Architecture: The Network</h1>
  <span class="sub">Teachers · employers · partners · prizes</span>
  <span class="counts" id="counts"></span>
</header>

<button id="sheet-toggle">Filters</button>

<aside class="panel" id="left">
  <div class="lab">Find</div>
  <input type="search" id="q" placeholder="Sullivan, Studio Gang, Emerging Voices 2019…" autocomplete="off" aria-label="Search the network">
  <div id="hits"></div>

  <div class="lab">Relationships</div>
  <div id="edgeToggles"></div>

  <div class="lab">Node types</div>
  <div id="kindToggles"></div>

  <div class="lab">Views</div>
  <div class="preset" id="presets">
    <button data-p="all">Everything</button>
    <button data-p="lineage">Lineage only</button>
    <button data-p="prizes">Prize network</button>
    <button data-p="schools">Schools</button>
    <button data-p="now">Active now</button>
  </div>

  <div class="lab">Layout</div>
  <div class="preset">
    <button id="reheat">Re-settle</button>
    <button id="fit">Fit to screen</button>
    <button id="clearfocus">Clear focus</button>
  </div>
</aside>

<section class="panel" id="right" aria-live="polite"><div id="dossier"></div></section>

<div id="tip"></div>
<div id="hint">Drag to pan · scroll to zoom · click a node · double-click to focus its neighbourhood</div>
<div id="loading">Settling 1,200 nodes…</div>

<script>
(function(){
"use strict";
const EK = {
  office:{label:"employed", color:"#f0b46b", w:1.5, dist:46},
  studio:{label:"taught",   color:"#5fcfe8", w:1.5, dist:52},
  partner:{label:"partner", color:"#f07ab0", w:1.4, dist:34},
  hire:{label:"recruited",  color:"#8fdc9b", w:1.3, dist:58},
  faculty:{label:"teaches at", color:"#b092ff", w:1.0, dist:70},
  seat:{label:"led",        color:"#b092ff", w:1.8, dist:60},
  principal:{label:"principal of", color:"#8fa6ba", w:1.0, dist:26},
  honor:{label:"honoured by",color:"#e0c065", w:0.8, dist:78}
};
const KK = {
  person:{label:"People", color:"#e6eef4"},
  practice:{label:"Practices", color:"#f0b46b"},
  award:{label:"Prizes & cohorts", color:"#e0c065"},
  school:{label:"Schools", color:"#b092ff"}
};

const byId = new Map();
const nodes = NODES.map(n=>{ const o=Object.assign({}, n); byId.set(o.id,o); return o; });
const links = [];
EDGES.forEach(([s,t,k])=>{ if(byId.has(s)&&byId.has(t)) links.push({source:s,target:t,k:k}); });

const nbr = new Map();
nodes.forEach(n=>nbr.set(n.id,[]));
links.forEach(l=>{ nbr.get(l.source).push({id:l.target,k:l.k,dir:"out"}); nbr.get(l.target).push({id:l.source,k:l.k,dir:"in"}); });
nodes.forEach(n=>{ n.deg = nbr.get(n.id).length; });

const state = {
  edgeOn: new Set(Object.keys(EK)),
  kindOn: new Set(Object.keys(KK)),
  onlyNow: false, hideOrphans:false, linked:null, sel:null, focus:null, hover:null
};

/* ---------- canvas ---------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
window.addEventListener("resize",resize);

let tf = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([0.12,7]).on("zoom", e=>{ tf=e.transform; draw(); });
d3.select(cv).call(zoom);

/* ---------- simulation ---------- */
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d=>d.id).distance(l=>EK[l.k].dist).strength(l=> l.k==="honor"?0.12: l.k==="principal"?0.7:0.35))
  .force("charge", d3.forceManyBody().strength(d=> d.k==="award"? -420 : d.k==="school"? -320 : -58).distanceMax(700))
  .force("collide", d3.forceCollide().radius(d=>radius(d)+4))
  .force("x", d3.forceX(0).strength(0.028))
  .force("y", d3.forceY(0).strength(0.032))
  .alpha(1).alphaDecay(0.022).velocityDecay(0.36);

sim.stop();
let settled=false;
const TOTAL_TICKS=300;
function prewarm(done){
  let n=0;
  const load=document.getElementById("loading");
  function chunk(){
    for(let i=0;i<30 && n<TOTAL_TICKS;i++,n++) sim.tick();
    load.textContent = "Settling the network — " + Math.round(100*n/TOTAL_TICKS) + "%";
    draw();
    if(n<TOTAL_TICKS) requestAnimationFrame(chunk);
    else{
      settled=true; load.style.display="none";
      fitView(); sim.alpha(0.2).alphaTarget(0).restart(); sim.on("tick",draw);
      if(done) done();
    }
  }
  requestAnimationFrame(chunk);
}

function radius(d){
  if(d.k==="award") return d.h && d.h[0]==="HONOR" ? 9 : 7;
  if(d.k==="school") return 7;
  if(d.k==="practice") return 3.4;
  return 3 + Math.min(3.4, d.deg*0.35);
}
function visible(d){
  if(!state.kindOn.has(d.k)) return false;
  if(state.onlyNow && !d.now && d.k!=="award" && d.k!=="school") return false;
  if(state.hideOrphans && state.linked && !state.linked.has(d.id)) return false;
  return true;
}
function refreshVisibility(){
  if(!state.hideOrphans){ state.linked=null; return; }
  state.linked=null;
  const set=new Set();
  for(const l of links){
    if(!state.edgeOn.has(l.k)) continue;
    const s=l.source.id||l.source, t=l.target.id||l.target;
    if(!state.kindOn.has(byId.get(s).k)||!state.kindOn.has(byId.get(t).k)) continue;
    set.add(s); set.add(t);
  }
  state.linked=set;
}
function linkVisible(l){
  return state.edgeOn.has(l.k) && visible(l.source) && visible(l.target);
}
function dim(d){
  if(!state.focus) return false;
  return !state.focusSet.has(d.id);
}

/* ---------- drawing ---------- */
function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(tf.x,tf.y); ctx.scale(tf.k,tf.k);

  // links
  for(const l of links){
    if(!linkVisible(l)) continue;
    const s=l.source,t=l.target;
    const faded = state.focus && !(state.focusSet.has(s.id)&&state.focusSet.has(t.id));
    const spec=EK[l.k];
    ctx.globalAlpha = faded?0.05:(l.k==="honor"?0.32:l.k==="principal"?0.4:0.78);
    ctx.strokeStyle=spec.color;
    ctx.lineWidth=spec.w/Math.max(0.6,tf.k);
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y); ctx.stroke();
  }
  // nodes
  ctx.globalAlpha=1;
  for(const d of nodes){
    if(!visible(d)) continue;
    const r=radius(d), faded=dim(d);
    ctx.globalAlpha = faded?0.12:1;
    const col = KK[d.k].color;
    ctx.beginPath();
    if(d.k==="practice"){ ctx.rect(d.x-r,d.y-r,r*2,r*2); }
    else if(d.k==="award"){ ctx.moveTo(d.x,d.y-r); ctx.lineTo(d.x+r,d.y); ctx.lineTo(d.x,d.y+r); ctx.lineTo(d.x-r,d.y); ctx.closePath(); }
    else { ctx.arc(d.x,d.y,r,0,6.2832); }
    if(d.k==="person"){ ctx.fillStyle= d.now? "#ffffff":"#9fc0d6"; ctx.fill(); }
    else if(d.k==="practice"){ ctx.fillStyle="rgba(240,180,107,.22)"; ctx.fill(); ctx.strokeStyle=col; ctx.lineWidth=1.1/Math.max(.6,tf.k); ctx.stroke(); }
    else { ctx.fillStyle=col; ctx.globalAlpha=faded?0.12:0.9; ctx.fill(); }
    if(d.id===state.sel){ ctx.globalAlpha=1; ctx.strokeStyle="#f07ab0"; ctx.lineWidth=2/tf.k; ctx.beginPath(); ctx.arc(d.x,d.y,r+4/tf.k,0,6.2832); ctx.stroke(); }
  }
  // labels
  ctx.globalAlpha=1;
  const showAll = tf.k>1.5;
  ctx.textAlign="left"; ctx.textBaseline="middle";
  for(const d of nodes){
    if(!visible(d)) continue;
    const important = d.k==="award"||d.k==="school"||d.deg>=6;
    const near = state.focus && state.focusSet.has(d.id);
    const isSel = d.id===state.sel||d.id===state.hover;
    if(!(isSel||near||important||(showAll&&d.deg>1))) continue;
    if(dim(d)) continue;
    const fs = (d.k==="award"||d.k==="school") ? 12 : isSel?13:10.5;
    ctx.font = (isSel?"600 ":"") + (fs/tf.k) + "px 'Archivo Narrow', sans-serif";
    ctx.fillStyle = isSel? "#ffffff" : d.k==="award"? "#e9d59a" : d.k==="school"? "#cdbcff" : "rgba(230,238,244,.82)";
    if(tf.k<0.45 && !isSel && !(d.k==="award"||d.k==="school")) continue;
    ctx.fillText(d.n, d.x + (radius(d)+4)/tf.k, d.y);
  }
  ctx.restore();
}

function fitView(){
  const vs = nodes.filter(visible);
  if(!vs.length) return;
  const xs=vs.map(d=>d.x), ys=vs.map(d=>d.y);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const k = Math.min(W/(x1-x0+140), H/(y1-y0+140), 2.2);
  const t = d3.zoomIdentity.translate(W/2 - k*(x0+x1)/2, H/2 - k*(y0+y1)/2).scale(k);
  d3.select(cv).transition().duration(500).call(zoom.transform, t);
}
function centerOn(d, k){
  const s = k || Math.max(tf.k, 1.4);
  const t = d3.zoomIdentity.translate(W/2 - s*d.x, H/2 - s*d.y).scale(s);
  d3.select(cv).transition().duration(600).call(zoom.transform, t);
}

/* ---------- picking ---------- */
function pick(mx,my){
  const p = tf.invert([mx,my]);
  let best=null, bd=Infinity;
  for(const d of nodes){
    if(!visible(d)) continue;
    const dx=d.x-p[0], dy=d.y-p[1], dist=dx*dx+dy*dy;
    const rr = Math.pow(radius(d)+8/tf.k,2);
    if(dist<rr && dist<bd){ bd=dist; best=d; }
  }
  return best;
}
const tip=document.getElementById("tip");
cv.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect();
  const d=pick(e.clientX-r.left, e.clientY-r.top);
  state.hover = d? d.id : null;
  if(d){
    tip.style.display="block";
    tip.style.left=Math.min(window.innerWidth-260, e.clientX+14)+"px";
    tip.style.top=(e.clientY+14)+"px";
    tip.innerHTML = '<div>'+esc(d.n)+'</div><div class="t2">'+(d.k==="person"?"person":d.k)+(d.l?" · "+esc(d.l):"")+" · "+d.deg+" link"+(d.deg===1?"":"s")+'</div>';
  } else tip.style.display="none";
  draw();
});
cv.addEventListener("mouseleave",()=>{ tip.style.display="none"; state.hover=null; draw(); });
cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect();
  const d=pick(e.clientX-r.left, e.clientY-r.top);
  if(d) select(d.id); 
});
cv.addEventListener("dblclick",e=>{
  const r=cv.getBoundingClientRect();
  const d=pick(e.clientX-r.left, e.clientY-r.top);
  if(d){ setFocus(d.id); centerOn(d); }
});

/* ---------- focus ---------- */
function setFocus(id){
  state.focus=id;
  const set=new Set([id]); let frontier=[id];
  for(let hop=0;hop<2;hop++){
    const next=[];
    frontier.forEach(x=>nbr.get(x).forEach(nb=>{ if(state.edgeOn.has(nb.k)&&!set.has(nb.id)){ set.add(nb.id); next.push(nb.id);} }));
    frontier=next;
  }
  state.focusSet=set;
  draw();
}
document.getElementById("clearfocus").onclick=()=>{ state.focus=null; state.focusSet=null; draw(); };
document.getElementById("reheat").onclick=()=>{ sim.alpha(0.6).restart(); };
document.getElementById("fit").onclick=fitView;

/* ---------- selection + dossier ---------- */
const dossier=document.getElementById("dossier"), right=document.getElementById("right");
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function select(id){
  state.sel=id; const d=byId.get(id);
  right.hidden=false;
  const groups={};
  nbr.get(id).forEach(nb=>{
    if(!state.edgeOn.has(nb.k)) return;
    let head;
    if(nb.k==="office") head = nb.dir==="out" ? "Employed" : "Worked for";
    else if(nb.k==="studio") head = nb.dir==="out" ? "Taught" : "Studied under";
    else if(nb.k==="hire") head = nb.dir==="out" ? "Recruited" : "Recruited by";
    else if(nb.k==="partner") head = "Partners";
    else if(nb.k==="principal") head = nb.dir==="out" ? "Principal of" : "Principals";
    else if(nb.k==="honor") head = nb.dir==="out" ? "Recognised by" : "Recognises";
    else if(nb.k==="seat") head = nb.dir==="out" ? "Led" : "Led by";
    else head = nb.dir==="out" ? "Teaches at" : "Faculty";
    (groups[head]=groups[head]||[]).push(nb);
  });
  let html = '<div class="d-kind">'+(d.k==="person"?"Person":d.k==="practice"?"Practice":d.k==="school"?"School":"Prize")+'</div>';
  html += '<h2 class="d-name">'+esc(d.n)+'</h2>';
  if(d.l) html += '<div class="d-life">'+esc(d.l)+'</div>';
  if(d.t) html += '<p class="d-note">'+esc(d.t)+'</p>';
  if(d.post) html += '<p class="d-post">'+esc(d.post)+(d.ver?'<span class="ver">affiliation verified against a school or press source, August 2026</span>':'')+'</p>';
  if((d.h&&d.h.length)||(d.a&&d.a.length)){
    html += '<div class="tagrow">';
    (d.h||[]).forEach(h=>{ if(HOUSE[h]) html += '<span class="tag">'+esc(HOUSE[h])+'</span>'; });
    (d.a||[]).forEach(a=>{ html += '<span class="tag aw">'+esc(a)+'</span>'; });
    html += '</div>';
  }
  const order=["Studied under","Worked for","Taught","Employed","Recruited","Recruited by","Partners","Principal of","Principals","Led","Led by","Teaches at","Faculty","Recognised by","Recognises"];
  order.forEach(h=>{
    if(!groups[h]) return;
    const col = EK[groups[h][0].k].color;
    html += '<div class="rel-group"><div class="rel-head" style="color:'+col+'">'+h+' · '+groups[h].length+'</div><div class="rel-list">';
    groups[h].sort((a,b)=>byId.get(a.id).n.localeCompare(byId.get(b.id).n))
      .forEach(nb=>{ html += '<button data-go="'+nb.id+'">'+esc(byId.get(nb.id).n)+'</button>'; });
    html += '</div></div>';
  });
  html += '<div class="actions"><button data-act="focus">Focus neighbourhood</button><button data-act="center">Centre</button><button data-act="close">Close</button></div>';
  dossier.innerHTML=html;
  dossier.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ select(b.dataset.go); centerOn(byId.get(b.dataset.go)); });
  dossier.querySelector('[data-act=focus]').onclick=()=>setFocus(id);
  dossier.querySelector('[data-act=center]').onclick=()=>centerOn(d);
  dossier.querySelector('[data-act=close]').onclick=()=>{ right.hidden=true; state.sel=null; draw(); };
  draw();
}
right.hidden=true;

/* ---------- toggles ---------- */
function counts(){
  const vn = nodes.filter(visible).length, vl = links.filter(linkVisible).length;
  document.getElementById("counts").textContent = vn.toLocaleString()+" nodes · "+vl.toLocaleString()+" links shown";
}
const edgeBox=document.getElementById("edgeToggles");
Object.entries(EK).forEach(([k,spec])=>{
  const b=document.createElement("button");
  b.className="toggle"; b.setAttribute("aria-pressed","true"); b.dataset.e=k;
  b.innerHTML='<span class="swatch" style="border-top-color:'+spec.color+'"></span><span>'+spec.label+'</span><span class="count">'+links.filter(l=>l.k===k).length+'</span>';
  b.onclick=()=>{ state.edgeOn.has(k)?state.edgeOn.delete(k):state.edgeOn.add(k);
    b.setAttribute("aria-pressed",String(state.edgeOn.has(k))); refreshVisibility(); if(state.focus) setFocus(state.focus); counts(); draw(); };
  edgeBox.appendChild(b);
});
const kindBox=document.getElementById("kindToggles");
Object.entries(KK).forEach(([k,spec])=>{
  const b=document.createElement("button");
  b.className="toggle"; b.setAttribute("aria-pressed","true"); b.dataset.k=k;
  b.innerHTML='<span class="dot '+k+'" style="color:'+spec.color+'"></span><span>'+spec.label+'</span><span class="count">'+nodes.filter(n=>n.k===k).length+'</span>';
  b.onclick=()=>{ state.kindOn.has(k)?state.kindOn.delete(k):state.kindOn.add(k);
    b.setAttribute("aria-pressed",String(state.kindOn.has(k))); refreshVisibility(); counts(); draw(); };
  kindBox.appendChild(b);
});
function applyPreset(p){
  document.querySelectorAll("#presets button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===p)));
  state.onlyNow=false; state.hideOrphans=false;
  if(p==="all"){ state.edgeOn=new Set(Object.keys(EK)); state.kindOn=new Set(Object.keys(KK)); }
  if(p==="lineage"){ state.edgeOn=new Set(["office","studio","partner","hire"]); state.kindOn=new Set(["person"]); state.hideOrphans=true; }
  if(p==="prizes"){ state.edgeOn=new Set(["honor","principal","partner"]); state.kindOn=new Set(["person","practice","award"]); }
  if(p==="schools"){ state.edgeOn=new Set(["seat","faculty","studio"]); state.kindOn=new Set(["person","school"]); state.hideOrphans=true; }
  if(p==="now"){ state.edgeOn=new Set(Object.keys(EK)); state.kindOn=new Set(Object.keys(KK)); state.onlyNow=true; }
  document.querySelectorAll("#edgeToggles .toggle").forEach(b=>b.setAttribute("aria-pressed",String(state.edgeOn.has(b.dataset.e))));
  document.querySelectorAll("#kindToggles .toggle").forEach(b=>b.setAttribute("aria-pressed",String(state.kindOn.has(b.dataset.k))));
  refreshVisibility();
  if(state.focus) setFocus(state.focus);
  counts(); draw();
}
document.querySelectorAll("#presets button").forEach(b=>b.onclick=()=>applyPreset(b.dataset.p));

/* ---------- search ---------- */
const q=document.getElementById("q"), hits=document.getElementById("hits");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase(); hits.innerHTML="";
  if(v.length<2) return;
  nodes.filter(n=>n.n.toLowerCase().includes(v)).sort((a,b)=>b.deg-a.deg).slice(0,14).forEach(n=>{
    const b=document.createElement("button");
    b.innerHTML='<span>'+esc(n.n)+'</span><span class="kind">'+(n.k==="person"?"":n.k)+'</span>';
    b.onclick=()=>{ select(n.id); centerOn(n, 1.8); };
    hits.appendChild(b);
  });
});

/* ---------- mobile ---------- */
const st=document.getElementById("sheet-toggle"), left=document.getElementById("left");
st.onclick=()=>{ left.hidden=!left.hidden; };
function mobileInit(){ if(window.innerWidth<=620) left.hidden=true; }

/* ---------- go ---------- */
resize(); mobileInit(); counts();
document.querySelector('#presets button[data-p=all]').setAttribute("aria-pressed","true");
setTimeout(prewarm, 60);
})();
</script>
